appId: com.jsonpretty.app
productName: JsonPretty
copyright: Copyright © 2025

directories:
  output: release
  buildResources: build

# В сборку попадает только то, что нужно в рантайме (никаких src/, node_modules dev-части и т.д.)
files:
  - electron/**
  - dist/**
  # Иконка окна: её читает главный процесс, поэтому она нужна и внутри asar
  - src/assets/**
  - package.json

asar: true

# Локали Chromium: приложение показывает свой интерфейс, а каждый неиспользуемый
# .pak — это ещё около мегабайта в сборке (все 55 языков занимают ~49 МБ).
# "ru" — для родного языка диалогов Chromium и DevTools, "en-US" — запасной.
electronLanguages:
  - ru
  - en-US

# Архивы приложения сжимаем по максимуму
compression: maximum

# Нативных зависимостей в проекте нет — не тратим время на @electron/rebuild
npmRebuild: false

win:
  # Иконка .exe и установщика: electron-builder сам делает из неё .ico
  icon: src/assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JsonPretty

portable:
  artifactName: ${productName}-${version}-portable.${ext}
